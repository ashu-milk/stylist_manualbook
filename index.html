<style>
:root{
  --bg:#FBF6F2;
  --surface:#FFFFFF;
  --surface-2:#F3E6DF;
  --surface-3:#EDE0D6;
  --text:#2E2A27;
  --text-soft:#726A63;
  --text-faint:#9C918A;
  --accent:#9C5B4A;
  --accent-dark:#6E3F33;
  --accent-tint:#F6E9E3;
  --rule:#E4D2C8;
  --ng-bg:#F3E3DF;
  --ng-text:#8A3223;
  --ng-rule:#C2604B;
  --shadow: 0 10px 30px -12px rgba(80,45,30,0.28);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);

  /* text size: auto-scales with screen width (phone -> 8" tablet), then multiplied
     by the reader's own preference (--user-scale), set via the Aa control */
  --viewport-scale: clamp(0.92, calc(0.8 + (100vw / 2400px)), 1.15);
  --user-scale: 1;
  --rs: calc(var(--viewport-scale) * var(--user-scale));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1512;
    --surface:#241C18;
    --surface-2:#2E231D;
    --surface-3:#382A22;
    --text:#F1E6DE;
    --text-soft:#C3B3A9;
    --text-faint:#8D7E75;
    --accent:#E08A67;
    --accent-dark:#F3B292;
    --accent-tint:#3A2A22;
    --rule:#4A382F;
    --ng-bg:#3B2620;
    --ng-text:#F0AE9B;
    --ng-rule:#B5654B;
    --shadow: 0 10px 30px -12px rgba(0,0,0,0.55);
  }
}
:root[data-theme="dark"]{
  --bg:#1B1512;
  --surface:#241C18;
  --surface-2:#2E231D;
  --surface-3:#382A22;
  --text:#F1E6DE;
  --text-soft:#C3B3A9;
  --text-faint:#8D7E75;
  --accent:#E08A67;
  --accent-dark:#F3B292;
  --accent-tint:#3A2A22;
  --rule:#4A382F;
  --ng-bg:#3B2620;
  --ng-text:#F0AE9B;
  --ng-rule:#B5654B;
  --shadow: 0 10px 30px -12px rgba(0,0,0,0.55);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
  overflow:hidden;
  overscroll-behavior:none;
}
.font-display{
  font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
}
h1,h2,h3{ text-wrap:balance; margin:0; }

#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  padding-left:var(--safe-l); padding-right:var(--safe-r);
}

/* ---------- view stack ---------- */
.view{
  position:absolute; inset:0;
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  padding-left:var(--safe-l); padding-right:var(--safe-r);
  display:flex; flex-direction:column;
  background:var(--bg);
  transform:translateX(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  visibility:hidden;
}
.view.active{ transform:translateX(0); visibility:visible; z-index:2;}
.view.behind{ transform:translateX(-24%); visibility:visible; z-index:1;}
@media (prefers-reduced-motion:reduce){
  .view{ transition:none; }
}

/* ================= HOME (cover) ================= */
#view-home{ z-index:3; }
.cover{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 28px 20px;
  text-align:center;
  position:relative;
  background:
    radial-gradient(120% 70% at 50% -10%, var(--accent-tint), transparent 60%),
    var(--bg);
}
.cover-eyebrow{
  font-size:12px; letter-spacing:.28em; color:var(--accent); font-weight:700;
  margin-bottom:18px;
}
.cover-mark{
  width:96px; height:96px; border-radius:24px;
  overflow:hidden;
  box-shadow:var(--shadow);
  margin-bottom:22px;
}
.cover-mark img{
  width:100%; height:100%; display:block; object-fit:cover;
}
.cover-title{
  font-size:30px; font-weight:700; line-height:1.5; color:var(--text);
}
.cover-sub{
  margin-top:14px; font-size:14px; line-height:1.9; color:var(--text-soft);
  max-width:280px;
}
.cover-rule{
  width:40px; height:2px; background:var(--accent); border-radius:2px; margin:22px 0;
}
.cover-meta{ font-size:11px; letter-spacing:.14em; color:var(--text-faint); }

.cover-actions{
  padding:0 24px calc(28px);
  display:flex; flex-direction:column; gap:10px;
}
.btn{
  border:none; border-radius:16px; padding:16px 18px;
  font-size:15px; font-weight:700; font-family:inherit;
  display:flex; align-items:center; justify-content:center; gap:8px;
  cursor:pointer;
}
.btn-primary{
  background:var(--accent); color:#fff;
  box-shadow:0 10px 22px -10px rgba(156,91,74,0.55);
}
:root[data-theme="dark"] .btn-primary, @media (prefers-color-scheme:dark){ }
.btn-ghost{
  background:var(--surface-2); color:var(--accent-dark);
}
.btn-resume{
  background:var(--surface); color:var(--text);
  border:1px solid var(--rule);
  font-weight:600;
  justify-content:space-between;
  text-align:left;
}
.btn-resume .r-label{ font-size:11px; color:var(--text-faint); font-weight:600; display:block; margin-bottom:2px; }
.btn-resume .r-title{ font-size:14px; color:var(--text); font-weight:700; }
.btn-resume .arrow{ color:var(--accent); font-size:18px; }

/* ================= TOC ================= */
.topbar{
  display:flex; align-items:center; gap:10px;
  padding:14px 16px 10px;
  flex-shrink:0;
}
.topbar h2{ font-size:17px; font-weight:700; flex:1; }
.iconbtn{
  width:36px; height:36px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); color:var(--accent-dark);
  border:none; font-size:16px; cursor:pointer; flex-shrink:0;
}
.scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }

.toc-part{ padding:18px 18px 4px; }
.toc-part-label{
  font-size:11px; letter-spacing:.18em; color:var(--accent); font-weight:700; margin-bottom:2px;
}
.toc-part-title{
  font-size:19px; font-weight:700; color:var(--text); margin-bottom:12px;
}
.toc-list{ padding:0 12px 8px; display:flex; flex-direction:column; gap:8px; }
.toc-item{
  display:flex; align-items:center; gap:12px;
  background:var(--surface); border:1px solid var(--rule);
  border-radius:14px; padding:13px 14px;
  cursor:pointer;
}
.toc-num{
  width:30px; height:30px; border-radius:9px; flex-shrink:0;
  background:var(--surface-2); color:var(--accent-dark);
  font-size:12px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  font-variant-numeric:tabular-nums;
}
.toc-text{ flex:1; min-width:0; }
.toc-text .t{ font-size:14.5px; font-weight:700; color:var(--text); line-height:1.4; }
.toc-text .s{ font-size:12px; color:var(--text-soft); margin-top:2px; }
.toc-chev{ color:var(--text-faint); font-size:15px; }
.toc-divider{ height:1px; background:var(--rule); margin:6px 18px 14px; }

/* ================= READER ================= */
.reader-top{
  flex-shrink:0; padding:10px 8px;
  display:flex; align-items:center; gap:6px;
  border-bottom:1px solid var(--rule);
  background:var(--bg);
}
.reader-top .chip{
  font-size:11px; font-weight:700; color:var(--accent);
  background:var(--accent-tint); padding:5px 10px; border-radius:100px;
  white-space:nowrap;
}
.reader-top .title{
  flex:1; min-width:0; font-size:13px; font-weight:700; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center;
}
.progress-track{ height:3px; background:var(--surface-3); flex-shrink:0; }
.progress-fill{ height:100%; background:var(--accent); width:0%; transition:width .25s; }

.reader-flip{
  flex:1; position:relative; overflow:hidden;
  perspective:1600px; -webkit-perspective:1600px;
  background:var(--bg);
}
.leaf{
  position:absolute; inset:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:26px 22px 40px;
  background:var(--bg);
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  transform-style:preserve-3d;
}
.leaf.z-top{ z-index:2; }
.leaf.z-bottom{ z-index:1; }
.leaf.curl-next{ transform-origin:left center; animation:curlNext .52s cubic-bezier(.32,.1,.32,1) forwards; }
.leaf.curl-prev{ transform-origin:right center; animation:curlPrev .52s cubic-bezier(.32,.1,.32,1) forwards; }
.leaf.curl-next::after,
.leaf.curl-prev::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(100deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.32) 50%, rgba(255,255,255,0) 60%);
  opacity:0; animation:pageShine .52s cubic-bezier(.32,.1,.32,1) forwards;
}
@keyframes curlNext{
  0%   { transform:rotateY(0deg);    box-shadow:none; filter:brightness(1); }
  30%  { box-shadow:60px 0 70px -25px rgba(20,10,5,.4); filter:brightness(.92); }
  100% { transform:rotateY(-112deg); box-shadow:90px 0 100px -30px rgba(20,10,5,0); filter:brightness(.78); }
}
@keyframes curlPrev{
  0%   { transform:rotateY(0deg);   box-shadow:none; filter:brightness(1); }
  30%  { box-shadow:-60px 0 70px -25px rgba(20,10,5,.4); filter:brightness(.92); }
  100% { transform:rotateY(112deg); box-shadow:-90px 0 100px -30px rgba(20,10,5,0); filter:brightness(.78); }
}
@keyframes pageShine{
  0%{ opacity:0; } 45%{ opacity:.85; } 100%{ opacity:0; }
}
@media (prefers-reduced-motion:reduce){
  .leaf.curl-next, .leaf.curl-prev{ animation:none !important; transform:none !important; }
  .leaf.curl-next::after, .leaf.curl-prev::after{ animation:none !important; }
}
.reader-kicker{ font-size:calc(12px * var(--rs)); font-weight:700; letter-spacing:.14em; color:var(--accent); margin-bottom:10px;}
.reader-h1{ font-size:calc(23px * var(--rs)); font-weight:700; line-height:1.5; color:var(--text); margin-bottom:22px; }
.reader-h1::after{
  content:""; display:block; width:34px; height:3px; background:var(--accent); border-radius:2px; margin-top:14px;
}
.sec-h{
  font-size:calc(16px * var(--rs)); font-weight:700; color:var(--accent-dark); margin:26px 0 10px;
  display:flex; align-items:baseline; gap:8px;
}
.sec-h .dot{ color:var(--accent); }
.sub-h{ font-size:calc(14px * var(--rs)); font-weight:700; color:var(--text); margin:18px 0 8px; }
p.body{ font-size:calc(15px * var(--rs)); line-height:1.95; color:var(--text); margin:0 0 14px; }
ul.blist{ list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:9px; }
ul.blist li{ font-size:calc(14.5px * var(--rs)); line-height:1.85; color:var(--text); padding-left:18px; position:relative; }
ul.blist li::before{ content:"●"; color:var(--accent); font-size:7px; position:absolute; left:0; top:8px; }
ul.blist li b{ color:var(--accent-dark); font-weight:700; }

ul.checklist{ list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:11px; }
ul.checklist li{ font-size:calc(14.5px * var(--rs)); line-height:1.8; color:var(--text); display:flex; gap:10px; align-items:flex-start; }
ul.checklist li .box{ flex-shrink:0; font-size:calc(15px * var(--rs)); line-height:1.8; }

.timeline-phase{
  display:flex; align-items:baseline; gap:10px; margin:26px 0 10px;
}
.timeline-phase .t{
  font-size:calc(12.5px * var(--rs)); font-weight:700; color:#fff; background:var(--accent);
  padding:4px 10px; border-radius:100px; white-space:nowrap; font-variant-numeric:tabular-nums;
}
.timeline-phase .h{ font-size:calc(16px * var(--rs)); font-weight:700; color:var(--accent-dark); }

.callout{
  margin:16px 0 20px; border-radius:16px; overflow:hidden;
  border:1px solid var(--rule); background:var(--surface);
}
.callout-head{
  background:var(--accent); color:#fff; font-size:calc(13px * var(--rs)); font-weight:700;
  padding:10px 14px;
}
.callout-body{ padding:14px 14px 10px; }
.callout-line{ font-size:calc(14.5px * var(--rs)); line-height:1.85; color:var(--text); font-style:italic; margin-bottom:10px; }
.callout-point{ font-size:calc(13px * var(--rs)); font-weight:700; color:var(--accent-dark); line-height:1.8; padding-top:8px; border-top:1px dashed var(--rule); }

.ng-box{
  background:var(--ng-bg); border:1px solid var(--ng-rule); border-radius:14px;
  padding:13px 15px; margin:16px 0 20px;
  font-size:calc(14.5px * var(--rs)); font-weight:700; color:var(--ng-text); line-height:1.7;
}

.stable{ width:100%; border-collapse:separate; border-spacing:0; margin:14px 0 20px; border:1px solid var(--rule); border-radius:14px; overflow:hidden;}
.stable th{ background:var(--accent); color:#fff; font-size:calc(12.5px * var(--rs)); padding:10px; text-align:left; }
.stable td{ padding:12px 10px; font-size:calc(13.5px * var(--rs)); line-height:1.75; border-top:1px solid var(--rule); vertical-align:top; }
.stable td.pat{ font-weight:700; color:var(--accent-dark); white-space:nowrap; width:1%; }
.stable tr:nth-child(even) td{ background:var(--surface-2); }
.stable .eff{ display:block; margin-top:6px; font-size:calc(12px * var(--rs)); color:var(--text-soft); font-weight:600; }
.stable .line{ font-style:italic; }

.pull{
  margin:22px 0 6px; padding:16px 16px 16px 18px;
  border-left:3px solid var(--accent);
  font-size:calc(14px * var(--rs)); font-style:italic; line-height:1.85; color:var(--accent-dark);
}

.reader-nav{
  flex-shrink:0; display:flex; gap:10px; padding:12px 16px;
  border-top:1px solid var(--rule); background:var(--bg);
}
.navbtn{
  flex:1; border:none; border-radius:14px; padding:13px 10px;
  font-size:13px; font-weight:700; font-family:inherit; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  background:var(--surface-2); color:var(--accent-dark);
}
.navbtn .lbl{ font-size:10px; color:var(--text-faint); font-weight:600; }
.navbtn:disabled{ opacity:.35; }
.navbtn.primary{ background:var(--accent); color:#fff; }
.navbtn.primary .lbl{ color:rgba(255,255,255,0.75); }

.toast{
  position:fixed; left:50%; bottom:calc(24px + var(--safe-b));
  transform:translate(-50%,12px); opacity:0;
  background:var(--accent-dark); color:#fff; font-size:12.5px; font-weight:600;
  padding:10px 16px; border-radius:100px; box-shadow:var(--shadow);
  transition:opacity .25s, transform .25s; pointer-events:none; z-index:50;
  white-space:nowrap;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

.textsize-btn{ font-family:var(--font-sans,inherit); font-size:14px; font-weight:700; letter-spacing:-0.02em; }

.sheet-backdrop{
  position:fixed; inset:0; background:rgba(20,12,8,0.38);
  opacity:0; visibility:hidden; transition:opacity .22s; z-index:60;
}
.sheet-backdrop.show{ opacity:1; visibility:visible; }
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61;
  background:var(--surface); border-radius:22px 22px 0 0;
  padding:10px 20px calc(22px + var(--safe-b));
  box-shadow:0 -12px 30px -10px rgba(20,12,8,0.3);
  transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.sheet.show{ transform:translateY(0); }
.sheet-handle{ width:36px; height:4px; border-radius:100px; background:var(--rule); margin:2px auto 16px; }
.sheet-title{ font-size:14px; font-weight:700; color:var(--text-soft); margin-bottom:14px; text-align:center; }
.size-options{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.size-opt{
  border:1.5px solid var(--rule); background:var(--surface); border-radius:14px;
  padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:6px;
  cursor:pointer; color:var(--text);
}
.size-opt .sz-a{ font-weight:700; line-height:1; color:var(--text); }
.size-opt .sz-label{ font-size:11px; font-weight:600; color:var(--text-soft); }
.size-opt.active{ border-color:var(--accent); background:var(--accent-tint); }
.size-opt.active .sz-a, .size-opt.active .sz-label{ color:var(--accent-dark); }

::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>

/* =========================================================
   APP LOGIC
========================================================= */
const app = (function(){
  const chapters = [];
  BOOK.forEach((part, pi) => part.chapters.forEach((c, ci) => {
    chapters.push({ ...c, partIndex: pi, partTitle: part.title, partLabel: part.label, chapterIndexInPart: ci });
  }));

  let current = 0;
  let storageOK = true;

  function save(key, val){
    try{ localStorage.setItem(key, val); }catch(e){ storageOK = false; }
  }
  function load(key){
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }

  function showView(id){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active','behind'));
    document.getElementById(id).classList.add('active');
  }

  /* ---------- text size (auto phone-to-tablet scaling + reader preference) ---------- */
  function applyTextScale(v){
    document.documentElement.style.setProperty('--user-scale', v);
    document.querySelectorAll('.size-opt').forEach(btn=>{
      btn.classList.toggle('active', Math.abs(parseFloat(btn.dataset.scale) - v) < 0.001);
    });
  }
  function initTextScale(){
    let v = 1;
    const raw = load('textScale');
    if(raw !== null){ const n = parseFloat(raw); if(!isNaN(n)) v = n; }
    applyTextScale(v);
  }

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._tm);
    toast._tm = setTimeout(()=>t.classList.remove('show'), 1600);
  }

  function renderTOC(){
    const el = document.getElementById('tocScroll');
    const multiPart = BOOK.length > 1;
    let html = '';
    BOOK.forEach((part, pi)=>{
      html += `<div class="toc-part">
        ${multiPart ? `<div class="toc-part-label">PART ${pi+1}</div>` : ''}
        <div class="toc-part-title font-display">${part.title}</div>
      </div>
      <div class="toc-list">`;
      part.chapters.forEach((c, ci)=>{
        const idx = chapters.findIndex(x=>x.id===c.id);
        html += `<div class="toc-item" onclick="app.openChapter(${idx})">
          <div class="toc-num">${c.num}</div>
          <div class="toc-text">
            <div class="t">${c.title}</div>
            <div class="s">${c.sub||''}</div>
          </div>
          <div class="toc-chev">›</div>
        </div>`;
      });
      html += `</div>`;
      if(pi < BOOK.length-1) html += `<div class="toc-divider"></div>`;
    });
    el.innerHTML = html;
  }

  /* ---------- reader: page-curl transition between chapters ---------- */
  let activeLeafId = 'leafA';
  let isAnimating = false;

  function prefersReducedMotion(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  function fillLeaf(el, c){
    el.innerHTML = c.html;
    el.scrollTop = 0;
  }
  function updateChrome(i){
    const c = chapters[i];
    const chip = document.getElementById('readerChip');
    if(BOOK.length > 1){
      chip.style.display = '';
      chip.textContent = 'PART ' + (c.partIndex+1);
    } else {
      chip.style.display = 'none';
    }
    document.getElementById('readerTopTitle').textContent = c.title;
    document.getElementById('progressFill').style.width = Math.round(((i+1)/chapters.length)*100) + '%';
    document.getElementById('prevBtn').disabled = (i===0);
    const nextLabel = document.getElementById('nextLabel');
    nextLabel.textContent = (i === chapters.length-1) ? '読了 ✓' : '次の章 ›';
    current = i;
    save('lastChapter', String(i));
    updateResumeButton();
  }

  function gotoChapter(i, opts){
    opts = opts || {};
    const c = chapters[i];
    updateChrome(i);

    const topEl = document.getElementById(activeLeafId);
    const bottomId = activeLeafId === 'leafA' ? 'leafB' : 'leafA';
    const bottomEl = document.getElementById(bottomId);

    const animate = opts.dir && !opts.instant && !prefersReducedMotion();

    if(!animate){
      fillLeaf(topEl, c);
      topEl.className = 'leaf z-top';
      bottomEl.className = 'leaf z-bottom';
      isAnimating = false;
      return;
    }

    isAnimating = true;
    fillLeaf(bottomEl, c);
    bottomEl.className = 'leaf z-bottom';

    const curlClass = opts.dir === 'next' ? 'curl-next' : 'curl-prev';
    topEl.className = 'leaf z-top';
    void topEl.offsetWidth; // restart animation reliably
    topEl.classList.add(curlClass);

    const onEnd = (ev) => {
      if(ev.target !== topEl) return;
      topEl.removeEventListener('animationend', onEnd);
      topEl.className = 'leaf z-bottom';
      bottomEl.className = 'leaf z-top';
      activeLeafId = bottomId;
      isAnimating = false;
    };
    topEl.addEventListener('animationend', onEnd);
  }

  function updateResumeButton(){
    const raw = load('lastChapter');
    const btn = document.getElementById('resumeBtn');
    if(raw !== null && chapters[+raw]){
      btn.style.display = 'flex';
      document.getElementById('resumeTitle').textContent = chapters[+raw].title;
    }
  }

  return {
    init(){
      renderTOC();
      updateResumeButton();
      initTextScale();
      if(!storageOK){ /* silent fallback, in-memory only */ }
    },
    openTOC(){ showView('view-toc'); },
    goHome(){ showView('view-home'); },
    openChapter(i){ gotoChapter(i, {instant:true}); showView('view-reader'); },
    resume(){
      const raw = load('lastChapter');
      const i = raw!==null ? +raw : 0;
      this.openChapter(i);
    },
    prevChapter(){
      if(isAnimating || current<=0) return;
      gotoChapter(current-1, {dir:'prev'});
    },
    nextChapter(){
      if(isAnimating) return;
      if(current < chapters.length-1){ gotoChapter(current+1, {dir:'next'}); }
      else { toast('お疲れさまでした。読了です 🌿'); }
    },
    openTextSize(){
      document.getElementById('sizeSheetBackdrop').classList.add('show');
      document.getElementById('sizeSheet').classList.add('show');
    },
    closeTextSize(){
      document.getElementById('sizeSheetBackdrop').classList.remove('show');
      document.getElementById('sizeSheet').classList.remove('show');
    },
    setTextScale(v){
      applyTextScale(v);
      save('textScale', String(v));
      this.closeTextSize();
    }
  };
})();

app.init();

/* register add-to-home-screen affordance hint (no-op if unsupported) */
window.addEventListener('DOMContentLoaded', ()=>{});
</script>
